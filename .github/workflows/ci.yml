name: ATS Resume Checker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# No real credentials or services are needed: AI tests use scripted providers and the
# backend tests start their own in-memory MongoDB.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: npm
        cache-dependency-path: server/package-lock.json
    - name: Install dependencies
      run: npm ci --prefix server
    - name: Run backend tests
      working-directory: server
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
        AI_PROVIDER: none
      run: npx jest --runInBand

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: npm
        cache-dependency-path: client/package-lock.json
    - name: Install dependencies
      run: npm ci --prefix client
    - name: Build
      run: npm run build --prefix client
